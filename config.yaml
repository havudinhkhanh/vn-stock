# =====================================================================
#  CÀI ĐẶT HỆ THỐNG VN-STOCK
#  Anh sửa file này ngay trên web GitHub (bấm biểu tượng cây bút ✏️),
#  sửa số, rồi bấm "Commit changes". Lần chạy kế tiếp sẽ dùng số mới.
#  Dòng bắt đầu bằng dấu # là ghi chú, máy bỏ qua.
# =====================================================================

universe:
  exchanges: [HOSE, HNX, UPCOM]      # sàn được phân tích
  min_avg_value_bn: 3.0              # chỉ khuyến nghị MUA mã có GTGD bình quân 20 phiên >= 3 tỷ/ngày
  min_price: 5.0                     # bỏ mã giá dưới 5.000đ (nghìn đồng)
  min_history_days: 120              # mã mới niêm yết dưới 120 phiên: chỉ theo dõi

# ---------------------------------------------------------------------
#  PHÂN BỔ VỐN THEO RỔ (tổng = 100)
# ---------------------------------------------------------------------
allocation:
  # Anh chọn ngày 07/10/2026 dựa trên backtest 2020-2026 (có đèn thị trường): ~+14%/năm, sụt tối đa ~-18%
  garp: 40        # Chất lượng + tăng trưởng hợp lý
  growth: 30      # Tăng trưởng mạnh (CANSLIM)
  defensive: 30   # Phòng thủ (biến động thấp, nợ thấp, có cổ tức)
  dividend: 0     # Cổ tức  – backtest 2020-2026 yếu (+3,8%/năm) khi kèm điều kiện xu hướng tăng
  value: 0        # Giá trị – backtest 2020-2026 yếu (+2,0%/năm)

# ---------------------------------------------------------------------
#  TRỌNG SỐ CÁC PHƯƠNG PHÁP KHI CHẤM ĐIỂM TỔNG HỢP (0 = tắt)
# ---------------------------------------------------------------------
methods:
  piotroski: 15       # sức khoẻ tài chính 9 tiêu chí
  magic_formula: 15   # Greenblatt: tốt + rẻ
  value: 20           # rẻ so với ngành và lịch sử, có biên an toàn
  quality: 15         # ROE, biên lợi nhuận, dòng tiền ổn định
  growth: 10          # tăng trưởng doanh thu/lợi nhuận
  dividend: 10        # cổ tức tiền mặt bền vững
  momentum: 10        # sức mạnh giá 3-12 tháng
  canslim: 5          # CANSLIM
  low_vol: 0          # biến động thấp
  smc: 0              # Smart Money Concepts – bật khi tab Kiểm chứng cho thấy có lợi thế
  vsa: 0              # Volume Spread Analysis
  wyckoff_ev: 0       # Wyckoff sự kiện & pha
  orderflow: 0        # Order Flow / footprint (cần vài tháng lưu dữ liệu)

# ---------------------------------------------------------------------
#  QUY TẮC CHỌN MÃ (đã kiểm chứng bằng backtest 2020-2026 trên ~430 mã có BCTC)
# ---------------------------------------------------------------------
strategy:
  trend_filter: up       # up = chỉ mua khi giá > MA50 > MA200 | above200 = giá > MA200 | not_down = chỉ tránh mã đang giảm
  min_mcap_bn: 1000      # chỉ chọn doanh nghiệp vốn hoá từ 1.000 tỷ (tránh mã nhỏ, dễ bị bẫy giá trị)
  value_guard: true      # rổ Giá trị: loại mã lợi nhuận sụt >10%, dòng tiền KD âm, nợ vay > 2 lần vốn

# ---------------------------------------------------------------------
#  QUẢN TRỊ RỦI RO
# ---------------------------------------------------------------------
risk:
  max_positions: 8            # tối đa số mã nắm cùng lúc
  min_positions: 5
  max_weight_per_stock: 20    # % vốn tối đa cho 1 mã
  max_weight_per_sector: 30   # % vốn tối đa cho 1 ngành
  risk_per_trade: 1.5         # % vốn chấp nhận lỗ cho mỗi lệnh (nếu chạm cắt lỗ)
  max_stop_loss_pct: 20       # cắt lỗ khi giảm 20% so với giá mua. Backtest 2020-2026: 12% làm giảm lợi nhuận
                              # (bán đáy rồi mua lại); 20% cân bằng hơn cho chiến lược đánh cơ bản
  max_drawdown_target: 25     # mức sụt danh mục chấp nhận (anh chọn ưu tiên lợi nhuận)
  margin_of_safety: 20        # chỉ mua khi giá thấp hơn giá trị hợp lý ít nhất 20%
  use_margin: false

# ---------------------------------------------------------------------
#  GIẢ ĐỊNH ĐỊNH GIÁ (anh có thể chỉnh theo quan điểm vĩ mô)
# ---------------------------------------------------------------------
valuation:
  risk_free: 3.2              # % lợi suất TPCP 10 năm (tự cập nhật nếu lấy được, nếu không dùng số này)
  equity_risk_premium: 8.0    # % phần bù rủi ro cổ phiếu Việt Nam
  terminal_growth: 4.0        # % tăng trưởng dài hạn (≈ GDP danh nghĩa thận trọng)
  tax_rate: 20                # % thuế TNDN
  forecast_years: 5
  dividend_tax: 5             # % thuế cổ tức tiền mặt cá nhân

# ---------------------------------------------------------------------
#  LỊCH CHẠY & THÔNG BÁO
# ---------------------------------------------------------------------
data:
  orderflow_top: 250          # số mã lấy footprint dòng lệnh mỗi phiên (mã thanh khoản nhất)
  orderflow_min_value_bn: 5   # chỉ lấy mã GTGD bình quân ≥ 5 tỷ/ngày
  dividends_per_run: 120
  shares_per_run: 120

intraday:
  min_value_bn: 2             # theo dõi hành vi giá trong phiên cho mã GTGD bình quân ≥ 2 tỷ/ngày
  max_symbols: 450            # tối đa số mã lấy nến phút mỗi lượt (thanh khoản cao nhất trước)
  budget_sec: 420             # giới hạn thời gian tải nến phút/giờ mỗi lượt sau đóng cửa (tải dần lịch sử)
  tick_symbols: 12            # số mã (đang nắm / theo dõi) lấy lệnh khớp Cá mập/Sói/Cừu
  tick_budget_sec: 150
  live_bars: 90               # số mã lấy nến phút trong lượt 11:35 / 14:35 (mã anh nắm, theo dõi, mua + mã biến động mạnh)

schedule:
  rebalance: monthly          # monthly | quarterly
  financials_refresh_weekday: 5   # 0=Thứ 2 ... 5=Thứ 7: ngày tải lại toàn bộ BCTC

notify:
  telegram: true
  only_when_action: true      # chỉ nhắn khi có việc cần làm

backtest:
  start: "2016-01-01"
  rebalance: monthly
  cost_pct: 0.25              # phí + thuế mỗi chiều (%)
  report_lag_days: 45         # BCTC quý chỉ được dùng sau 45 ngày (tránh "nhìn trước tương lai")
  use_stop: true              # mô phỏng cắt lỗ như hệ thống thật
  slots_per_basket: 8         # mỗi rổ đo bằng 8 mã (đa dạng hoá, kết quả ổn định hơn)
  liquidity_factor: 1.0       # thanh khoản tối thiểu = đúng mức của hệ thống thật
