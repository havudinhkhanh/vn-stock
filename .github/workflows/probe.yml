name: Kiểm tra nguồn dữ liệu

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Để trống = nguồn dữ liệu; intraday = nến phút, khớp lệnh, tin tức, quyền token"
        type: string
        default: ""

permissions:
  contents: write   # để đẩy báo cáo lên nhánh `status`

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNSTOCK_DATA: probe_out
      VNSTOCK_RETRIES: "1"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Thử từng nguồn (VCI, TCBS, Yahoo)
        run: |
          mkdir -p probe_out
          python run.py probe ${{ inputs.what }} 2>&1 | tee probe_out/probe.log
          exit ${PIPESTATUS[0]}
      - name: Đẩy báo cáo lên nhánh status
        if: always()
        run: bash scripts/publish_status.sh probe probe_out/probe_report.json probe_out/probe.log
